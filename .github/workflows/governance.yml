name: Healthcare AI Governance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master, develop]

permissions:
  contents: read
  pull-requests: write

jobs:

  # ── PR Gate ──────────────────────────────────────────────────────────────
  pr-governance-gate:
    name: PR Governance Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python governance dependencies
        run: pip install pyyaml semgrep detect-secrets

      - name: Install Node dependencies (for npm audit)
        run: npm install --package-lock-only 2>/dev/null || true

      - name: Validate governance.yaml
        run: python core/validators/config_validator.py governance.yaml

      - name: Save PR body for attribution scanner
        run: |
          cat << 'PR_BODY_EOF' > /tmp/pr_body.txt
          ${{ github.event.pull_request.body }}
          PR_BODY_EOF

      - name: Run PR governance checks
        id: governance
        run: |
          python core/run_checks.py \
            --stage pr \
            --paths src \
            --config governance.yaml \
            --pr-number ${{ github.event.pull_request.number }} \
            --build-ref ${{ github.sha }} \
            --pr-body-file /tmp/pr_body.txt \
            --base-branch ${{ github.event.pull_request.base.ref }}
        continue-on-error: true

      - name: Post governance scorecard as PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            let body = '## Healthcare AI Governance Results\n\n';

            const scorecardDir = '.governance/scorecards';
            if (fs.existsSync(scorecardDir)) {
              const files = fs.readdirSync(scorecardDir)
                .filter(f => f.endsWith('.txt'))
                .sort();
              if (files.length > 0) {
                const latest = path.join(scorecardDir, files[files.length - 1]);
                const content = fs.readFileSync(latest, 'utf8');
                body += '```\n' + content + '\n```';
              }
            }

            if (body === '## Healthcare AI Governance Results\n\n') {
              const outcome = '${{ steps.governance.outcome }}';
              body += outcome === 'success'
                ? '✅ All governance checks passed.'
                : '❌ Governance checks failed — check the Actions log for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-scorecard-pr-${{ github.event.pull_request.number }}
          path: .governance/scorecards/
          retention-days: 90

      - name: Fail if governance checks did not pass
        if: steps.governance.outcome == 'failure'
        run: |
          echo "::error::Governance checks failed. Resolve all CRITICAL findings before merging."
          exit 1

  # ── Pipeline Gate ─────────────────────────────────────────────────────────
  pipeline-governance-gate:
    name: Pipeline Governance Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install governance dependencies
        run: pip install pyyaml semgrep detect-secrets

      - name: Install Node dependencies
        run: npm install --package-lock-only 2>/dev/null || true

      - name: Validate governance.yaml
        run: python core/validators/config_validator.py governance.yaml

      - name: Run pipeline governance checks
        run: |
          python core/run_checks.py \
            --stage pipeline \
            --paths src \
            --config governance.yaml \
            --build-ref ${{ github.sha }}

      - name: Upload scorecard artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: governance-scorecard-${{ github.sha }}
          path: .governance/scorecards/
          retention-days: 365
