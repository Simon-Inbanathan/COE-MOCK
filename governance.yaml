team:
  name: "COE Mock EMR Team"
  platform: github
  architect: "simonsezz10@gmail.com"
  tech_lead: "simonsezz10@gmail.com"
  tech_stack:
    - node
  clinical_reviewers:
    - "simonsezz10@gmail.com"

baa:
  verified: false
  vendor: "anthropic"
  notes: "TODO: confirm BAA status before using AI tools with any PHI examples"

checks:
  pre_commit:
    phi_detection: true
    secrets_scan: true
    sast: true
  pr_gate:
    sast: true
    dependency_scan: true
    hipaa_checks: true
    clinical_review_required: true
    post_results_as_comment: true
  pipeline_gate:
    compliance_scorecard: true
    block_on_open_criticals: true

thresholds:
  block_on_severity: critical
  escalate_on_severity: high
  max_allowed_highs: 0

phi_patterns:
  custom_identifiers:
    - patient_id
    - member_id
    - subscriber_id
    - policy_number
    - mrn
    - referenceId
  exclude_paths:
    - "node_modules/**"
    - "dist/**"
    - "*.lock"
    - "**/*.spec.ts"

clinical_keywords:
  trigger_terms:
    - enrollment
    - diagnosis
    - prescription
    - medication
    - clinical
    - fhir
    - hl7
    - icd
    - cpt
    - prior_auth
    - eligibility
    - consent
    - hipaa
